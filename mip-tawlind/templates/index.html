<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>MIP + Tailwind CSS</title>
  <link rel="stylesheet" href="dist/output.css">
</head>

          <div class="font-semibold text-sm mt-2">Оптимизация</div>
